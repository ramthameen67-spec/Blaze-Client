<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blaze Client (Gemini)</title>
<style>
:root{--bg:#fff6ef;--pan:#fff;--tx:#2b1810;--mu:#80675b;--bd:#f0d9cb;--em:#ff5a1f;--fl:#ffb21a;--ut:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110c0a;--pan:#1c1411;--tx:#f7ece5;--mu:#b39d91;--bd:#3a2a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110c0a;--pan:#1c1411;--tx:#f7ece5;--mu:#b39d91;--bd:#3a2a22;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
header{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.logo{font-size:26px}
h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,var(--em),var(--fl));-webkit-background-clip:text;background-clip:text;color:transparent}
.st{margin-left:auto;font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px}
.st i{width:8px;height:8px;border-radius:50%;background:var(--mu)}.st.on i{background:var(--em);box-shadow:0 0 8px var(--em)}
nav{display:flex;gap:6px;padding:4px 14px 8px}
nav button{flex:1;min-width:0;white-space:nowrap;padding:8px 4px;border:1px solid var(--bd);background:var(--pan);color:var(--mu);border-radius:10px;font:inherit;font-size:13.5px;font-weight:700}
nav button.on{background:linear-gradient(135deg,var(--em),var(--fl));color:#fff;border-color:transparent}
.view{display:none;flex:1;min-height:0;flex-direction:column}.view.on{display:flex}
#log{flex:1;overflow:auto;padding:6px 14px 12px;display:flex;flex-direction:column;gap:10px}
.b{max-width:88%;padding:10px 13px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere}
.b.assistant{background:var(--pan);border:1px solid var(--bd);align-self:flex-start;border-bottom-left-radius:4px}
.b.user{background:linear-gradient(135deg,var(--em),#ff9a1a);color:var(--ut);align-self:flex-end;border-bottom-right-radius:4px}
.b div+div,.b pre{margin-top:8px}
pre{background:#0d0908;color:#ffd9bd;padding:10px;border-radius:10px;overflow-x:auto;font-size:12px}
code{background:rgba(255,120,40,.15);padding:1px 5px;border-radius:5px}
.gc{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:9px 11px;border-radius:12px;border:1px dashed var(--em);font-weight:700}
.gc button,.chips button{border:0;border-radius:9px;padding:7px 12px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--em),var(--fl))}
.fire{font-style:normal;display:inline-block;animation:fl .7s infinite alternate}
@keyframes fl{to{transform:scale(1.25) rotate(8deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{background:var(--pan);color:var(--tx);border:1px solid var(--bd);font-weight:600}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--em);animation:d 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes d{50%{transform:translateY(-5px);opacity:.4}}
.comp{display:flex;gap:8px;padding:8px 14px 10px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:120px;padding:10px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--pan);color:var(--tx);font:inherit}
#send{width:44px;height:44px;padding:0;border:0;border-radius:50%;font-size:18px;color:#fff;background:#ff7a1a;box-shadow:0 2px 8px rgba(255,122,26,.4)}
.bar{display:flex;gap:6px;padding:0 14px 8px;align-items:center}
.bar span{flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{border:1px solid var(--bd);background:var(--pan);color:var(--tx);border-radius:9px;padding:6px 9px;font:inherit;font-size:13px}
#stage{flex:1;min-height:0;margin:0 14px 10px;border-radius:14px;overflow:hidden;background:#000;position:relative}
#frame{width:100%;height:100%;border:0;display:none}
.empty{padding:40px 24px;text-align:center;color:var(--mu)}
.empty button{margin-top:12px;border:0;border-radius:10px;padding:10px 16px;color:#fff;font:inherit;font-weight:800;background:linear-gradient(135deg,var(--em),var(--fl))}
#stage .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#d9b9a6}
#lib{padding:4px 14px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.g{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--pan);border:1px solid var(--bd);border-radius:12px}
.g b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.g small{color:var(--mu)}
.g button{border:0;border-radius:9px;padding:7px 11px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--em),var(--fl))}
.g button.x{background:var(--bd);color:var(--tx)}
.exit{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:5;border:0;border-radius:50%;width:38px;height:38px;background:rgba(0,0,0,.65);color:#fff;font-size:16px}
body.full header,body.full nav,body.full .bar{display:none}body.full .exit{display:block}body.full #stage{margin:0;border-radius:0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);background:#000d;color:#fff;padding:9px 14px;border-radius:12px;font-size:13px;max-width:86%;display:none;z-index:40;text-align:center}
#set{display:none;position:fixed;inset:0;z-index:20;background:#000a;align-items:center;justify-content:center;padding:16px}
#set.on{display:flex}#set .card{background:var(--pan);border:1px solid var(--bd);border-radius:16px;padding:16px;width:100%;max-width:420px}
#set h2{margin:0 0 6px}#set p{margin:0 0 10px;color:var(--mu);font-size:13px}
#set label{display:block;font-weight:700;font-size:13px;margin-top:8px}
#set input{width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
#set .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#set .row button{border:0;border-radius:9px;padding:9px 13px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--em),var(--fl))}
#set .row .x{background:var(--bd);color:var(--tx)}
.im img{display:block;max-width:100%;border-radius:12px;border:1px solid var(--bd)}.im a{display:inline-block;margin-top:6px;font-size:13px;font-weight:800;color:var(--em);text-decoration:none}
#plus{width:44px;height:44px;flex:none;border:1px solid var(--bd);border-radius:50%;background:var(--pan);color:var(--tx);font-size:24px;line-height:1;padding:0}
.mrow{padding:2px 14px 0}.mc{position:relative;display:inline-block}.mc::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mu);font-size:12px}
#msel{appearance:none;-webkit-appearance:none;border:1px solid var(--bd);background:var(--pan);color:var(--tx);border-radius:999px;padding:5px 28px 5px 12px;font:inherit;font-size:13px;font-weight:700}
#ap{display:flex;gap:10px;padding:8px 14px 2px;overflow-x:auto}#ap:empty{display:none}.th{position:relative;flex:none}.th img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);display:block}
.th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border:0;border-radius:50%;background:#000c;color:#fff;font-size:11px;padding:0}
.ua{display:block;max-width:100%;max-height:200px;border-radius:10px;margin-bottom:6px}
#dr{position:fixed;inset:0;z-index:15;background:#0008;display:none}#dr.on{display:block}
#dr .pn{position:absolute;left:0;top:0;bottom:0;width:min(82%,320px);background:var(--pan);border-right:1px solid var(--bd);padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:10px;animation:sl .18s ease-out}
@keyframes sl{from{transform:translateX(-100%)}}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:17px}
#nc{border:0;border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--em),var(--fl))}
#cl{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.ci{display:flex;align-items:center;gap:6px;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}.ci.on{border-color:var(--em)}
.ci b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;cursor:pointer}.ci button{border:0;background:none;color:var(--mu);font-size:15px}
#set .card{max-height:100%;overflow:auto}#set textarea{width:100%;flex:none;margin-top:4px;padding:10px;border-radius:10px;background:var(--bg);font-size:15px}
#ms,#as{position:fixed;inset:0;z-index:18;background:#0008;display:none;align-items:flex-end}#ms.on,#as.on{display:flex}
.sh{width:100%;max-height:82%;overflow:auto;background:var(--pan);border:1px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 16px);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sh-h{display:flex;align-items:center;gap:10px;font-size:18px}.sh-t{font-size:18px}#msb{border:0;background:none;color:var(--tx);font-size:22px;padding:0 4px}
.mi{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:14px;padding:12px 14px;margin-top:8px;font:inherit}
.mi.on{border-color:var(--em);box-shadow:0 0 0 1px var(--em) inset}.mi b{font-size:16px}.mi small{display:block;color:var(--mu);margin-top:2px;font-size:13px}
.tg{font-size:11px;font-weight:800;margin-left:8px;padding:2px 8px;border-radius:999px;background:rgba(255,120,40,.18);color:var(--em)}.mi .ck{float:right;color:var(--em);font-weight:900}
.ag{display:flex;gap:10px;margin-top:12px}.ag button{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:16px;padding:16px 6px;font:inherit;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:8px}.ag span{font-size:30px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
#mb,#pl{border:1px solid var(--bd);background:var(--pan);color:var(--tx);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:700}
.fl{width:56px;height:56px;border-radius:10px;border:1px solid var(--bd);background:var(--pan);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px}.fl small{font-size:9px;color:var(--mu);max-width:52px;overflow:hidden;white-space:nowrap}
#cm{position:fixed;inset:0;z-index:18;background:#0008;display:none;align-items:flex-end}#cm.on{display:flex}
#cmi{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
#au{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);align-items:center;justify-content:center;padding:16px;overflow:auto}#au.on{display:flex}
#au .card{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--pan);border:1px solid var(--bd);border-radius:16px;padding:16px}
#au p{margin:0 0 10px;color:var(--mu);font-size:13px}#au label{display:block;font-weight:700;font-size:13px;margin-top:10px}
#au input{width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
#al{display:flex;flex-direction:column;gap:6px}#pwr{gap:8px;margin-top:8px}#pwr input{margin-top:0}#au .row{margin-top:14px}
#au .row button,#pwb{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--em),var(--fl))}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--bd);padding-top:10px;font-weight:700}.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:9px;padding:6px 12px;font:inherit;font-size:13px}
#send svg{display:block;margin:auto}
#vo{display:none;position:fixed;inset:0;z-index:25;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}#vo.on{display:flex}
#orb{width:150px;height:150px;border-radius:50%;background:#ff7a1a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px rgba(255,90,31,.45);cursor:pointer;animation:pu 1.6s ease-in-out infinite}
#orb svg{width:72px;height:72px}#orb rect{transform-box:fill-box;transform-origin:center;animation:wv .9s ease-in-out infinite alternate}
#orb rect:nth-child(2){animation-delay:.15s}#orb rect:nth-child(3){animation-delay:.3s}#orb rect:nth-child(4){animation-delay:.45s}
@keyframes wv{from{transform:scaleY(.45)}to{transform:scaleY(1.4)}}@keyframes pu{50%{transform:scale(1.07)}}
#orb[data-s=think]{animation-duration:.7s}#orb[data-s=think] rect{animation:none}
#vs{font-size:20px;font-weight:800}#vt{color:var(--mu);min-height:3.5em;max-width:92%;font-size:15px}
#ve{border:1px solid var(--bd);background:var(--pan);color:var(--tx);border-radius:999px;padding:12px 26px;font:inherit;font-weight:800;margin-top:16px}
#vl{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.vc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.vc.on{border-color:#ff7a1a;box-shadow:0 0 0 1px #ff7a1a inset}.vc b{display:block}.vc small{display:block;color:var(--mu);font-size:12px}
.vc i{font-style:normal;margin-left:auto;color:#fff;background:#ff7a1a;border-radius:8px;padding:5px 10px;font-weight:800;font-size:12px}
.rd{display:block;margin-top:6px;border:0;background:none;font-size:15px;padding:2px 4px;opacity:.7}
#mic{display:block;width:100%;margin-top:8px;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:800;color:#fff;background:#ff7a1a}
</style></head>
<body>
<header><button id="menu" aria-label="Saved chats" style="border:0;background:none;font-size:24px;color:var(--tx);padding:0 2px">☰</button><span class="logo">🔥</span><h1>BLAZE CLIENT</h1><div class="st" id="st"><i></i><span>no key</span></div><button id="gear" aria-label="Settings" style="border:0;background:none;font-size:20px">⚙️</button></header>
<nav><button data-t="chat" class="on">💬 ChatBot</button><button data-t="code">🎮 Code Game</button><button data-t="games">📁 Games</button></nav>

<section class="view on" id="v-chat">
 <div id="log"></div>
 <div id="ap"></div><div class="mrow"><button id="mb" aria-label="Choose model"></button><button id="pl" style="display:none">🕹 Player</button></div>
 <div class="comp"><button id="plus" aria-label="Add image">+</button><input type="file" id="fc" accept="image/*" capture="environment" hidden><input type="file" id="fi" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><input type="file" id="ff" multiple hidden accept="image/*,application/pdf,text/*,.md,.csv,.json,.js,.ts,.html,.css,.py,.xml,.yml,.yaml,.log,.java,.c,.cpp"><input type="file" id="fa" accept="audio/*" capture hidden><textarea id="in" rows="1" placeholder="Message Blaze…"></textarea><button id="send" aria-label="Send">➤</button></div>
</section>

<section class="view" id="v-play">
 <div class="bar"><span id="gt">No game loaded</span><button id="rs">↻ Restart</button><button id="tw">🛠 Tweak</button><button id="cp">⧉ Code</button><button id="fs">⛶</button></div>
 <div id="stage"><iframe id="frame" sandbox="allow-scripts" allow="autoplay"></iframe>
  <div class="empty" id="pe"><div style="font-size:42px">🕹️</div><div>No game yet. Ask Blaze to forge one!</div><button id="goc">Build a game</button></div></div>
</section>

<section class="view" id="v-games"><div id="lib"></div></section>
<div id="vo"><div id="orb" data-s="listen"><svg viewBox="0 0 24 24"><g fill="#fff"><rect x="3.6" y="9.25" width="2.4" height="5.5" rx="1.2"/><rect x="8.4" y="4.5" width="2.4" height="15" rx="1.2"/><rect x="13.2" y="6.75" width="2.4" height="10.5" rx="1.2"/><rect x="18" y="9" width="2.4" height="6" rx="1.2"/></g></svg></div><div id="vs">Listening…</div><div id="vt"></div><button id="ve">✕ End</button></div>
<div id="cm"><div class="sh"><b class="sh-t" id="cmt"></b><div id="cmb"></div></div></div>
<div id="au" class="on"><div class="card"><div style="font-size:42px;text-align:center">🔥</div><h2 style="text-align:center;margin:4px 0 2px">BLAZE CLIENT</h2><p id="ah" style="text-align:center"></p><div id="al"></div>
<div id="pwr" style="display:none"><input id="pwi" type="password" placeholder="Passcode"><button id="pwb">Sign in</button></div>
<label>New account<input id="an" maxlength="24" placeholder="Your name"></label><label>Passcode (optional)<input id="apw" type="password" placeholder="4+ characters, or leave empty"></label>
<div class="row"><button id="mkb">Create &amp; sign in</button></div></div></div>
<div id="ms"><div class="sh"><div class="sh-h"><button id="msb" aria-label="Back">←</button><b id="mst"></b></div><div id="msl"></div></div></div>
<div id="as"><div class="sh"><b class="sh-t">Add to chat</b><div class="ag"><button data-a="c"><span>📷</span>Camera</button><button data-a="p"><span>🖼️</span>Photos</button><button data-a="f"><span>📁</span>Files</button></div></div></div>
<div id="dr"><div class="pn"><div class="dh"><b>💬 Chats</b><button id="nc">+ New chat</button></div><div id="cl"></div><div class="who"><span id="who"></span><button id="so">Sign out</button></div></div></div>
<div id="set"><div class="card"><h2>Settings</h2>
<p>Get a free key at <b>aistudio.google.com/apikey</b>. It’s stored only in this browser and sent only to Google.</p>
<label>API key<input id="key" type="password" autocomplete="off" placeholder="Paste your Gemini API key"></label>
<label>Model<input id="mdl" list="ml" placeholder="gemini-flash-latest"></label>
<datalist id="ml"><option value="gemini-flash-latest"><option value="gemini-3.5-flash"><option value="gemini-2.5-flash"><option value="gemini-2.5-pro"></datalist>
<label>Image model<input id="imdl" list="il" placeholder="gemini-3.1-flash-image"></label>
<datalist id="il"><option value="gemini-3.1-flash-image"><option value="gemini-2.5-flash-image"></datalist>

<label>Voice model<input id="tmdl" list="tl" placeholder="gemini-3.1-flash-tts-preview"></label><datalist id="tl"><option value="gemini-3.1-flash-tts-preview"></datalist>
<label style="display:flex;align-items:center;gap:8px"><input id="ar" type="checkbox" style="width:auto;margin:0;padding:0"> Read Blaze’s replies out loud</label>
<button id="mic">🎤 Test microphone</button>
<label>Your name<input id="mn" placeholder="What should Blaze call you?"></label>
<label>About you<textarea id="ma" rows="3" placeholder="Age, hobbies, favorite games, how you want Blaze to talk to you…"></textarea></label>
<div class="row"><button id="ksave">Save</button><button id="kclear" class="x">Remove key</button><button id="kx" class="x">Close</button></div></div></div>
<button class="exit" id="ex" aria-label="Exit full screen">✕</button>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),F='`'.repeat(3);
const SYS='You are Blaze Client, a smart, upbeat, confident game-dev AI with a little fire in your personality. You live inside an app that has a built-in player: any game you code is run instantly in a sandboxed iframe and the person plays it right there. '+
'When asked for a game: reply with ONE short fun sentence, then ONE complete self-contained HTML file in a fenced code block (three backticks + html), then 1-2 short lines on the controls. '+
'Game rules: single file, inline CSS and JS only, no external libraries, images, fonts or network requests, no localStorage or sessionStorage (it is sandboxed). Prefer canvas. Fill the whole window and resize with it. Support BOTH touch (on-screen buttons or swipe/tap, touch-action:none) and keyboard controls because the person may be on a phone. Include a <title>, score, game over screen and an easy restart. Make it fun, polished and juicy (colors, particles, sound via WebAudio optional). Keep the code compact (about 250 lines max) so it finishes. '+

 const q=chunk(c,180);try{speechSynthesis.cancel()}catch(e){}
 q.forEach((x,i)=>{const u=new SpeechSynthesisUtterance(x);u.lang=navigator.language||'en-US';u.rate=1.05;u.pitch=.7;if(i===q.length-1)u.onend=u.onerror=()=>{if(id===spk){act=0;if(vm)listen()}};speechSynthesis.speak(u)})}
async function say(t){
 const c=t.replace(/```[\s\S]*?(```|$)/g,' ').replace(/\[\[IMAGE:[\s\S]*?(\]\]|$)/gi,' ').replace(/[*_`#>]/g,'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/\s+/g,' ').trim();
 stopSay();const id=spk;if(!c){if(vm)listen();return}
 act=id;vset('talk','Blaze is talking…',c.slice(0,160));unlock();
 const q=chunk(c,260);let i=0;
 try{let nx=tts(q[0]);for(i=0;i<q.length;i++){const b=await nx;if(id!==spk)return;nx=i+1<q.length?tts(q[i+1]):null;if(nx)nx.catch(()=>{});await play(b,id)}}
 catch(e){if(id!==spk)return;if(!dfail++)toast('Gemini voice failed: '+((e&&e.message)||'error').slice(0,90)+'. Using the device voice.');sayDev(q.slice(i).join(' '),id);return}
 if(id===spk){act=0;if(vm)listen()}}

async function stt(b,mime){
 const d=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(b)});
 const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{inlineData:{mimeType:mime||b.type||'audio/wav',data:d}},{text:'Transcribe the speech in this audio word for word. Reply with ONLY the transcript. If there is no speech, reply with nothing.'}]}]})});
 if(!res.ok){let m='';try{m=(await res.json()).error.message}catch(e){}throw new Error(m||'HTTP '+res.status)}
 const j=await res.json(),c=j.candidates&&j.candidates[0];return((c&&c.content&&c.content.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('').trim()}
function wav(ch,sr){let n=0;ch.forEach(c=>n+=c.length);const k=Math.max(1,Math.round(sr/16000)),m=Math.floor(n/k),o=new Int16Array(m);let j=0,a=0,q=0;
 for(const c of ch)for(let x=0;x<c.length;x++){a+=c[x];if(++q===k){if(j<m){const v=Math.max(-1,Math.min(1,a/k));o[j++]=v<0?v*32768:v*32767}a=0;q=0}}
 const r=Math.round(sr/k),h=new DataView(new ArrayBuffer(44)),w=(i,t)=>{for(let z=0;z<t.length;z++)h.setUint8(i+z,t.charCodeAt(z))};
 w(0,'RIFF');h.setUint32(4,36+m*2,true);w(8,'WAVEfmt ');h.setUint32(16,16,true);h.setUint16(20,1,true);h.setUint16(22,1,true);h.setUint32(24,r,true);h.setUint32(28,r*2,true);h.setUint16(32,2,true);h.setUint16(34,16,true);w(36,'data');h.setUint32(40,m*2,true);
 return new Blob([h,o],{type:'audio/wav'})}
function recWav(){return new Promise(async(res,rej)=>{
 let ms;try{ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){return rej(e)}
 unlock();const sn=ax.createMediaStreamSource(ms),pr=ax.createScriptProcessor(4096,1,1),ch=[];let talked=0,last=Date.now(),t0=last;endRec=0;
 pr.onaudioprocess=e=>{const d=new Float32Array(e.inputBuffer.getChannelData(0));ch.push(d);let s=0;for(let i=0;i<d.length;i+=8)s+=d[i]*d[i];if(Math.sqrt(s/(d.length/8))>.015){talked=1;last=Date.now()}};
 sn.connect(pr);pr.connect(ax.destination);
 const iv=setInterval(()=>{const n=Date.now();if(!(!vm||endRec||(talked&&n-last>1300)||n-t0>25000||(!talked&&n-t0>8000)))return;clearInterval(iv);try{pr.disconnect();sn.disconnect()}catch(e){}ms.getTracks().forEach(t=>t.stop());res(talked&&vm?wav(ch,ax.sampleRate):null)},100)})}
async function listenG(){if(!vm||lis)return;lis=1;vset('listen','Listening…','');let w;
 try{w=await recWav()}catch(e){lis=0;toast('Mic problem ('+((e&&e.name)||'error')+'). Tap the wave button to try again.');endVoice();return}
 lis=0;if(!vm)return;let t='';
 if(w){vset('think','Thinking…','');try{t=await stt(w,'audio/wav')}catch(e){toast('Couldn’t understand that: '+((e&&e.message)||'error').slice(0,80))}}
 if(t)talk(t);else if(++vfail>=3){toast('Didn’t hear anything. Tap the wave button to try again.');endVoice()}else setTimeout(listen,250)}
$('#fa').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!key){openSet();return}unlock();toast('Listening to your clip…');

  await send(t);const m=msgs[msgs.length-1];if(m&&m.role==='assistant'&&m.content.trim())say(m.content)}catch(x){toast('Couldn’t read that clip: '+((x&&x.message)||'error').slice(0,80))}};

 msgs=[];cid=null;S={code:{msgs:[],cid:null}};mode='chat';att=[];cur=null;busy=false;

async function hsh(p,s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}}
function enter(a){P=a.id+'_';acct=a;try{localStorage.setItem('blaze_cur',a.id)}catch(e){}loadAcct();$('#au').classList.remove('on');$('#pwr').style.display='none';$('#who').textContent='👤 '+a.name}

let pend=null;
async function mk(){const n=$('#an').value.trim(),pw=$('#apw').value;if(!n){toast('Enter a name');return}if(pw&&pw.length<4){toast('Passcode needs 4+ characters');return}
 const L=AC(),a={id:'u'+Date.now().toString(36),name:n.slice(0,24),s:Math.random().toString(36).slice(2),h:''};if(pw)a.h=await hsh(pw,a.s);
 try{if(!L.length&&!localStorage.getItem('blaze_adopted')){['blaze_games','blaze_chats','blaze_me','blaze_gkey','blaze_gmodel','blaze_gimg'].forEach(k=>{const v=localStorage.getItem(k);if(v!=null)localStorage.setItem(a.id+'_'+k,v)});localStorage.setItem('blaze_adopted','1')}
 if(!localStorage.getItem(a.id+'_blaze_me'))localStorage.setItem(a.id+'_blaze_me',JSON.stringify({n:a.name,a:''}))}catch(e){}
 L.push(a);saveAC(L);$('#an').value='';$('#apw').value='';enter(a)}
let cmid=null;
function chatMenu(id,st){const c=chats.find(x=>x.id===id);if(!c)return;cmid=id;$('#cmt').textContent=c.title;const b=$('#cmb');
 if(st==='r')b.innerHTML='<input id="cmi" maxlength="60" value="'+esc(c.title).replace(/"/g,'&quot;')+'"><div class="ag"><button data-c="rs">Save</button><button data-c="x">Cancel</button></div>';
 else if(st==='d')b.innerHTML='<p style="color:var(--mu)">Delete this chat for good?</p><div class="ag"><button data-c="ds">🗑 Delete</button><button data-c="x">Cancel</button></div>';
 else b.innerHTML='<button class="mi" data-c="p"><b>'+(c.pin?'📌 Unpin':'📌 Pin to top')+'</b></button><button class="mi" data-c="r"><b>✏️ Rename</b></button><button class="mi" data-c="d"><b>🗑 Delete</b></button>';
 $('#cm').classList.add('on');if(st==='r')setTimeout(()=>{const i=$('#cmi');if(i){i.focus();i.select()}},50)}
async function send(text){
 unlock();
 text=(text||'').trim();if((!text&&!att.length)||busy)return;
 if(!key){openSet();toast('Add your Gemini API key first');return}
 $('#in').value='';$('#in').style.height='auto';
 msgs.push({role:'user',content:text,att:att.splice(0)},{role:'assistant',content:''});drawAtt();const um=msgs[msgs.length-2],mine=msgs[msgs.length-1],undo=()=>{msgs.pop();msgs.pop();$('#in').value=text;att=um.att||[];drawAtt()};busy=true;ctrl=new AbortController();draw();
 try{
  const r=await gem(payload(),ctrl.signal,t=>{msgs[msgs.length-1].content=t;draw()});
  msgs[msgs.length-1].content=r.text;if(!r.text.trim()){undo();toast(r.blocked?'Google’s safety filter blocked that one. Try rewording it.':'Blaze came back empty. Try again.')}else if(r.truncated)toast('Blaze hit his length limit. If the game looks cut off, say “finish the game”.');
 }catch(e){
  if(ctrl.signal.aborted){const t=(e&&e.text)||msgs[msgs.length-1].content;if(t)msgs[msgs.length-1].content=t;else undo()}
  else{undo();const c=e&&e.status;
   toast(c===429?'Google says slow down (rate limit). Try again in a moment.':(c===400||c===403)&&/key/i.test(e.message)?'Google rejected that API key. Check it in ⚙️.':c===404?'Model not found. Change it in ⚙️.':'Something fizzled: '+((e&&e.message)||'network error'))}
 }
 const m=msgs.includes(mine)?mine:null,ip=m&&(m.content.match(/\[\[IMAGE:([\s\S]*?)\]\]/i)||[])[1];
 if(ip){m.ib=1;draw();try{m.img=await img(ip.trim(),ctrl.signal)}catch(e){if(!ctrl.signal.aborted){m.ie=1;toast('Image fizzled: '+((e&&e.message)||'network error'))}}m.ib=0}
 busy=false;const g=m&&mode==='code'?extract(m.content):null;
 if(g){m.game=g;games.unshift(g);games=games.slice(0,12);persist();load(g);setTimeout(()=>show('play'),500)}
 draw();saveChat();
 if(ar&&!vm&&m&&mode==='chat'&&m.content.trim())say(m.content);
}
function load(g){
 cur=g;let c=g.code;if(/<head[^>]*>/i.test(c)&&!/name=["']viewport/i.test(c))c=c.replace(/<head[^>]*>/i,m=>m+'<meta name="viewport" content="width=device-width,initial-scale=1">');
 const f=$('#frame');f.srcdoc=c;f.style.display='block';$('#pe').style.display='none';$('#gt').textContent=g.title;
 f.onload=()=>{try{f.focus()}catch(e){}};
}
